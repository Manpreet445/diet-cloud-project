<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Nutritional Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-primary:#059669;
    --color-primary-dark:#047857;
    --color-primary-deep:#065F46;
    --color-accent:#EA580C;
    --color-background:#ECFDF5;
    --color-foreground:#0F172A;
    --color-card:#FFFFFF;
    --color-muted:#64748B;
    --color-border:#E1F2ED;
    --color-destructive:#DC2626;
    --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Fira Sans',system-ui,sans-serif;
    background:var(--color-background);
    color:var(--color-foreground);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:var(--space-5);
  }
  .card{
    background:var(--color-card);
    border:1px solid var(--color-border);
    border-radius:14px;
    box-shadow:0 4px 20px rgba(6,95,70,0.07);
    width:100%;max-width:420px;
    overflow:hidden;
  }
  .card-head{
    background:linear-gradient(120deg,var(--color-primary-deep),var(--color-primary-dark));
    color:#fff;padding:var(--space-5);
    display:flex;align-items:center;gap:var(--space-2);
  }
  .card-head h1{font-size:1.3rem;font-weight:700;letter-spacing:-0.01em;}
  .card-head p{color:#A7F3D0;font-size:0.82rem;margin-top:2px;}
  .card-body{padding:var(--space-5);}

  .tabs{display:flex;gap:var(--space-2);margin-bottom:var(--space-4);}
  .tab{
    flex:1;padding:9px;border:1px solid var(--color-border);background:#fff;
    border-radius:8px;font:inherit;font-size:0.86rem;font-weight:600;
    color:var(--color-muted);cursor:pointer;transition:all .15s ease;
  }
  .tab[aria-selected="true"]{
    background:var(--color-primary);border-color:var(--color-primary);color:#fff;
  }

  label{display:block;font-size:0.76rem;font-weight:600;text-transform:uppercase;
    letter-spacing:0.05em;color:var(--color-muted);margin-bottom:5px;}
  input{
    width:100%;padding:10px 12px;border:1px solid var(--color-border);
    border-radius:8px;font:inherit;font-size:0.92rem;margin-bottom:var(--space-3);
    background:#fff;color:var(--color-foreground);
  }
  input:focus{outline:2px solid var(--color-primary);outline-offset:1px;border-color:transparent;}

  .btn{
    width:100%;padding:11px;border:none;border-radius:8px;font:inherit;
    font-size:0.92rem;font-weight:600;cursor:pointer;transition:background .15s ease;
  }
  .btn-primary{background:var(--color-primary);color:#fff;}
  .btn-primary:hover{background:var(--color-primary-dark);}
  .btn-primary:disabled{opacity:0.6;cursor:not-allowed;}

  .divider{
    display:flex;align-items:center;gap:var(--space-3);
    margin:var(--space-4) 0;color:var(--color-muted);font-size:0.78rem;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--color-border);}

  .btn-github{
    display:flex;align-items:center;justify-content:center;gap:var(--space-2);
    width:100%;padding:11px;border-radius:8px;
    background:#24292F;color:#fff;text-decoration:none;
    font-size:0.92rem;font-weight:600;transition:background .15s ease;
  }
  .btn-github:hover{background:#151A20;}

  .msg{
    margin-top:var(--space-3);padding:10px 12px;border-radius:8px;
    font-size:0.84rem;line-height:1.45;display:none;
  }
  .msg.error{display:block;background:#FEF2F2;color:var(--color-destructive);border:1px solid #FECACA;}
  .msg.ok{display:block;background:#ECFDF5;color:var(--color-primary-deep);border:1px solid #A7F3D0;}
</style>
</head>
<body>

<div class="card">
  <div class="card-head">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
      <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
    </svg>
    <div>
      <h1>Nutritional Insights</h1>
      <p>Sign in to view the dashboard</p>
    </div>
  </div>

  <div class="card-body">
    <div class="tabs" role="tablist">
      <button class="tab" id="tabLogin" role="tab" aria-selected="true">Sign in</button>
      <button class="tab" id="tabRegister" role="tab" aria-selected="false">Register</button>
    </div>

    <form id="authForm">
      <div id="nameField" style="display:none">
        <label for="name">Name</label>
        <input type="text" id="name" autocomplete="name" />
      </div>

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required minlength="6" />

      <button type="submit" class="btn btn-primary" id="submitBtn">Sign in</button>
    </form>

    <div class="msg" id="msg" role="status"></div>

    <div class="divider">or</div>

    <a class="btn-github" href="/.auth/login/github?post_login_redirect_uri=/">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
      Continue with GitHub
    </a>
  </div>
</div>

<script>
/* ============================================================
   Two ways to sign in:
     - GitHub, via the Static Web Apps built-in provider (the link above).
       No app registration needed; SWA handles the OAuth handshake.
     - Email/password, via our auth Function App below.

   The auth function key is injected at deploy time by GitHub Actions
   (repo secret AUTH_FUNCTION_KEY), same pattern as the dashboard's key.
   ============================================================ */
const AUTH_BASE = "https://nutrition-dashboard-func-epgrfff3c7gmhsgm.mexicocentral-01.azurewebsites.net/api";
const AUTH_KEY  = new URLSearchParams(location.search).get("authkey") || "__AUTH_KEY__";

let mode = "login";   // "login" | "register"

const el = id => document.getElementById(id);
const msg = el("msg");

function setMsg(text, kind){
  msg.textContent = text;
  msg.className = "msg" + (kind ? " " + kind : "");
}

function setMode(next){
  mode = next;
  const registering = mode === "register";
  el("tabLogin").setAttribute("aria-selected", String(!registering));
  el("tabRegister").setAttribute("aria-selected", String(registering));
  el("nameField").style.display = registering ? "block" : "none";
  el("name").required = registering;
  el("password").autocomplete = registering ? "new-password" : "current-password";
  el("submitBtn").textContent = registering ? "Create account" : "Sign in";
  setMsg("", "");
}

el("tabLogin").addEventListener("click", () => setMode("login"));
el("tabRegister").addEventListener("click", () => setMode("register"));

el("authForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = el("submitBtn");
  btn.disabled = true;
  setMsg(mode === "register" ? "Creating account…" : "Signing in…", "ok");

  const body = { email: el("email").value.trim(), password: el("password").value };
  if (mode === "register") body.name = el("name").value.trim();

  try {
    const res = await fetch(`${AUTH_BASE}/${mode}?code=${AUTH_KEY}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));

    if (!res.ok){
      setMsg(data.message || `Request failed (HTTP ${res.status})`, "error");
      btn.disabled = false;
      return;
    }

    if (mode === "register"){
      setMsg("Account created. You can sign in now.", "ok");
      setMode("login");
      btn.disabled = false;
      return;
    }

    // Logged in - hand the token to the dashboard
    localStorage.setItem("authToken", data.token);
    localStorage.setItem("authName", data.name || body.email);
    location.href = "/";
  } catch (err) {
    // A cross-origin block lands here with a useless "Failed to fetch"
    setMsg("Could not reach the auth service. If this persists, the auth Function App likely needs this site added to its CORS allowed origins.", "error");
    btn.disabled = false;
  }
});

setMode("login");
</script>
</body>
</html>
